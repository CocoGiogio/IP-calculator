<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calculateur IP</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --host-color: #10b981;
      --host-soft: #ecfdf5;
      --subnet-color: #8b5cf6;
      --radius: 16px;
    }

    body.dark {
      --bg: #0b0f19;
      --surface: #131a2a;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --accent: #3b82f6;
      --accent-soft: #172554;
      --host-color: #10b981;
      --host-soft: #064e3b;
      --subnet-color: #a78bfa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 20px 16px 40px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app { max-width: 560px; margin: 0 auto; }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; }
    .badge {
      font-size: 0.72rem; font-weight: 600; padding: 3px 9px; border-radius: 99px;
      background: var(--accent-soft); color: var(--accent); text-transform: uppercase;
    }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; cursor: pointer;
    }

    /* Carte de saisie */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.04);
    }

    .input-wrapper { position: relative; display: flex; align-items: center; }
    input[type="text"] {
      width: 100%; font-size: 1.1rem; font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 14px 42px 14px 14px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text); outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    .clear-btn {
      position: absolute; right: 12px; background: none; border: none;
      color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 4px;
    }

    .chips { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .chip {
      font-size: 0.75rem; font-family: ui-monospace, monospace; padding: 5px 10px;
      border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
      color: var(--text-muted); cursor: pointer;
    }

    .slider-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .slider-header {
      display: flex; justify-content: space-between; font-size: 0.82rem;
      font-weight: 600; margin-bottom: 6px; color: var(--text-muted);
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    /* Schéma visuel */
    .visual-title {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 12px;
    }

    .scope-pill {
      font-size: 0.72rem; padding: 3px 8px; border-radius: 6px;
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
    }

    /* Barre de bits */
    .bit-bar {
      display: flex; height: 28px; border-radius: 8px; overflow: hidden;
      font-size: 0.75rem; font-weight: 700; color: #fff; margin-bottom: 10px;
    }
    .bit-net {
      background: var(--accent); display: flex; align-items: center; justify-content: center;
      transition: width 0.2s ease; white-space: nowrap; overflow: hidden;
    }
    .bit-sub {
      background: var(--subnet-color); display: flex; align-items: center; justify-content: center;
      transition: width 0.2s ease; white-space: nowrap; overflow: hidden;
    }
    .bit-host {
      background: var(--host-color); display: flex; align-items: center; justify-content: center;
      transition: width 0.2s ease; white-space: nowrap; overflow: hidden;
    }

    /* Grille 32 bits IPv4 */
    .octets-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px;
    }
    .octet-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 4px; text-align: center; font-family: ui-monospace, monospace;
    }
    .octet-dec { font-size: 0.75rem; font-weight: 700; margin-bottom: 3px; }
    .octet-bits { font-size: 0.65rem; letter-spacing: 0.5px; }
    .b-net { color: var(--accent); font-weight: 700; }
    .b-host { color: var(--host-color); font-weight: 700; }

    /* Carte de position dans le bloc parent + voisins */
    .map-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px;
    }
    .map-header {
      display: flex; justify-content: space-between; font-size: 0.75rem;
      color: var(--text-muted); margin-bottom: 6px;
    }
    .map-track {
      position: relative; height: 12px; background: var(--border); border-radius: 99px; overflow: hidden;
    }
    .map-marker {
      position: absolute; top: 0; bottom: 0; background: var(--accent);
      border-radius: 99px; min-width: 6px; transition: all 0.2s ease;
    }
    .neighbors {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
      font-size: 0.75rem; gap: 6px;
    }
    .nav-sub {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 5px 8px; border-radius: 6px; font-family: ui-monospace, monospace;
      font-size: 0.72rem; cursor: pointer;
    }
    .nav-sub:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Résultats */
    .results-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; margin-bottom: 16px;
    }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .row:last-child { border-bottom: none; }
    .row-label { font-size: 0.83rem; color: var(--text-muted); flex-shrink: 0; }
    .row-value-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .row-value {
      font-family: ui-monospace, monospace; font-size: 0.9rem; font-weight: 600;
      text-align: right; word-break: break-all;
    }
    .copy-btn {
      background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 6px; padding: 4px 8px; font-size: 0.72rem; font-weight: 600; cursor: pointer;
    }
    .copy-btn.copied { border-color: var(--host-color); color: var(--host-color); }

    .error-msg {
      background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;
      padding: 12px 16px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 16px;
    }
    body.dark .error-msg { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }

    details {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px; font-size: 0.83rem;
    }
    summary {
      font-weight: 600; color: var(--text-muted); cursor: pointer; list-style: none;
      display: flex; justify-content: space-between;
    }
    summary::-webkit-details-marker { display: none; }
    .iana-grid {
      margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
      display: grid; gap: 8px; color: var(--text-muted); font-family: ui-monospace, monospace; font-size: 0.78rem;
    }
    .iana-item { display: flex; justify-content: space-between; }
    .iana-item strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <span>Calculateur IP</span>
        <span class="badge" id="protoBadge">IPv4</span>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Changer de thème">🌙</button>
    </header>

    <div class="card">
      <div class="input-wrapper">
        <input
          type="text"
          id="mainInput"
          value="192.168.1.10/24"
          placeholder="192.168.1.10/24 ou 192.168.1.10/255.255.255.0"
          autocapitalize="none"
          autocomplete="off"
          spellcheck="false"
        >
        <button class="clear-btn" id="clearBtn" title="Effacer">✕</button>
      </div>

      <div class="chips">
        <button class="chip" data-val="192.168.1.10/24">192.168.1.10/24</button>
        <button class="chip" data-val="10.24.16.5/255.255.252.0">10.24.16.5/22</button>
        <button class="chip" data-val="172.16.40.1 0.0.0.255">Wildcard</button>
        <button class="chip" data-val="2001:db8:85a3:12::1/64">IPv6 /64</button>
      </div>

      <div class="slider-box" id="sliderBox">
        <div class="slider-header">
          <span>Ajuster le masque</span>
          <span id="sliderLabel">/24</span>
        </div>
        <input type="range" id="cidrSlider" min="0" max="32" value="24">
      </div>
    </div>

    <div id="errorBox" class="error-msg" style="display:none;"></div>

    <!-- Schéma visuel dynamique -->
    <div id="visualCard" class="card"></div>

    <!-- Tableau des résultats -->
    <div id="resultsCard" class="results-card"></div>

    <details>
      <summary>
        <span>Plages non routables (IANA)</span>
        <span>▾</span>
      </summary>
      <div class="iana-grid">
        <div class="iana-item"><strong>10.0.0.0/8</strong><span>10.0.0.0 – 10.255.255.255</span></div>
        <div class="iana-item"><strong>172.16.0.0/12</strong><span>172.16.0.0 – 172.31.255.255</span></div>
        <div class="iana-item"><strong>192.168.0.0/16</strong><span>192.168.0.0 – 192.168.255.255</span></div>
        <div class="iana-item"><strong>100.64.0.0/10</strong><span>CGNAT (RFC 6598)</span></div>
        <div class="iana-item"><strong>169.254.0.0/16</strong><span>APIPA / Link-Local</span></div>
        <div class="iana-item"><strong>127.0.0.0/8</strong><span>Loopback</span></div>
        <div class="iana-item"><strong>224.0.0.0/4</strong><span>Multicast</span></div>
      </div>
    </details>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    const mainInput = document.getElementById('mainInput');
    const clearBtn = document.getElementById('clearBtn');
    const cidrSlider = document.getElementById('cidrSlider');
    const sliderLabel = document.getElementById('sliderLabel');
    const visualCard = document.getElementById('visualCard');
    const resultsCard = document.getElementById('resultsCard');
    const errorBox = document.getElementById('errorBox');
    const protoBadge = document.getElementById('protoBadge');
    const themeBtn = document.getElementById('themeBtn');

    if (localStorage.getItem('theme') === 'dark' ||
       (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.body.classList.add('dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeBtn.textContent = isDark ? '☀️' : '🌙';
    });

    function ip4ToInt(ip) {
      const parts = ip.trim().split('.');
      if (parts.length !== 4) throw new Error('Adresse IPv4 incomplète');
      let num = 0;
      for (const p of parts) {
        if (!/^\d+$/.test(p) || Number(p) > 255) throw new Error('Octet IPv4 invalide (0-255)');
        num = (num << 8) | Number(p);
      }
      return num >>> 0;
    }

    function intToIp4(int) {
      return [(int >>> 24) & 255, (int >>> 16) & 255, (int >>> 8) & 255, int & 255].join('.');
    }

    function parseMaskToPrefix(maskStr) {
      const maskInt = ip4ToInt(maskStr);
      const bin = maskInt.toString(2).padStart(32, '0');
      if (/^1*0*$/.test(bin)) {
        const idx = bin.indexOf('0');
        return idx === -1 ? 32 : idx;
      }
      if (/^0*1*$/.test(bin)) {
        const invBin = ((~maskInt) >>> 0).toString(2).padStart(32, '0');
        const idx = invBin.indexOf('0');
        return idx === -1 ? 32 : idx;
      }
      throw new Error('Masque ou Wildcard non contigu');
    }

    // Détection de la portée IPv4 et du bloc parent pour la carte visuelle
    function getIPv4Context(netInt, prefix) {
      const firstOctet = (netInt >>> 24) & 255;
      const secondOctet = (netInt >>> 16) & 255;

      if (firstOctet === 10) {
        return { label: 'Privé RFC 1918 (Classe A)', parentPrefix: 8, parentStart: ip4ToInt('10.0.0.0') };
      }
      if (firstOctet === 172 && secondOctet >= 16 && secondOctet <= 31) {
        return { label: 'Privé RFC 1918 (Classe B)', parentPrefix: 12, parentStart: ip4ToInt('172.16.0.0') };
      }
      if (firstOctet === 192 && secondOctet === 168) {
        return { label: 'Privé RFC 1918 (Classe C)', parentPrefix: 16, parentStart: ip4ToInt('192.168.0.0') };
      }
      if (firstOctet === 100 && secondOctet >= 64 && secondOctet <= 127) {
        return { label: 'CGNAT (RFC 6598)', parentPrefix: 10, parentStart: ip4ToInt('100.64.0.0') };
      }
      if (firstOctet === 169 && secondOctet === 254) {
        return { label: 'APIPA / Link-Local', parentPrefix: 16, parentStart: ip4ToInt('169.254.0.0') };
      }
      if (firstOctet === 127) {
        return { label: 'Loopback', parentPrefix: 8, parentStart: ip4ToInt('127.0.0.0') };
      }
      if (firstOctet >= 224 && firstOctet <= 239) {
        return { label: 'Multicast', parentPrefix: 4, parentStart: ip4ToInt('224.0.0.0') };
      }
      // Pour une IP publique, on compare par rapport à son /16 ou /8 parent
      const pPref = prefix > 16 ? 16 : (prefix > 8 ? 8 : 0);
      const pMask = pPref === 0 ? 0 : (~0 << (32 - pPref)) >>> 0;
      return { label: 'IPv4 Public Routable', parentPrefix: pPref, parentStart: (netInt & pMask) >>> 0 };
    }

    function renderIPv4Visual(ipInt, netInt, bcastInt, prefix) {
      const netPct = (prefix / 32) * 100;
      const hostPct = 100 - netPct;
      const fullBin = ipInt.toString(2).padStart(32, '0');
      const octets = [0, 1, 2, 3].map(i => {
        const dec = (ipInt >>> ((3 - i) * 8)) & 255;
        let bitsHtml = '';
        for (let b = 0; b < 8; b++) {
          const bitIdx = i * 8 + b;
          const cls = bitIdx < prefix ? 'b-net' : 'b-host';
          bitsHtml += `<span class="${cls}">${fullBin[bitIdx]}</span>`;
        }
        return `<div class="octet-box"><div class="octet-dec">${dec}</div><div class="octet-bits">${bitsHtml}</div></div>`;
      }).join('');

      // Positionnement dans le bloc parent
      const ctx = getIPv4Context(netInt, prefix);
      const effParentPrefix = Math.min(ctx.parentPrefix, prefix);
      const parentSize = Math.pow(2, 32 - effParentPrefix);
      const subSize = Math.pow(2, 32 - prefix);
      const offset = netInt - ctx.parentStart;

      const leftPct = Math.max(0, Math.min(100, (offset / parentSize) * 100));
      const widthPct = Math.max(1.5, Math.min(100 - leftPct, (subSize / parentSize) * 100));
      const subIndex = Math.floor(offset / subSize) + 1;
      const totalSubs = Math.floor(parentSize / subSize);

      // Sous-réseaux voisins
      const prevNet = netInt >= subSize ? (netInt - subSize) >>> 0 : null;
      const nextNet = (bcastInt + 1) <= 0xFFFFFFFF ? (bcastInt + 1) >>> 0 : null;

      visualCard.innerHTML = `
        <div class="visual-title">
          <span>Structure & Positionnement</span>
          <span class="scope-pill">${ctx.label}</span>
        </div>

        <div class="bit-bar">
          ${prefix > 0 ? `<div class="bit-net" style="width:${netPct}%">Réseau (${prefix}b)</div>` : ''}
          ${32 - prefix > 0 ? `<div class="bit-host" style="width:${hostPct}%">Hôtes (${32 - prefix}b)</div>` : ''}
        </div>

        <div class="octets-grid">${octets}</div>

        <div class="map-box">
          <div class="map-header">
            <span>Bloc ${intToIp4(ctx.parentStart)}/${effParentPrefix}</span>
            <span>Sous-réseau #${subIndex.toLocaleString('fr-FR')} / ${totalSubs.toLocaleString('fr-FR')}</span>
          </div>
          <div class="map-track">
            <div class="map-marker" style="left:${leftPct}%; width:${widthPct}%"></div>
          </div>
          <div class="neighbors">
            <button class="nav-sub" ${prevNet === null ? 'disabled' : `data-jump="${intToIp4(prevNet)}/${prefix}"`}>
              ← ${prevNet !== null ? intToIp4(prevNet) : 'Début'}
            </button>
            <span style="color:var(--text-muted); font-weight:600;">/${prefix}</span>
            <button class="nav-sub" ${nextNet === null ? 'disabled' : `data-jump="${intToIp4(nextNet)}/${prefix}"`}>
              ${nextNet !== null ? intToIp4(nextNet) : 'Fin'} →
            </button>
          </div>
        </div>
      `;
    }

    function computeIPv4(ipStr, prefix) {
      if (prefix < 0 || prefix > 32 || isNaN(prefix)) throw new Error('Préfixe IPv4 invalide (0-32)');
      const ipInt = ip4ToInt(ipStr);
      const maskInt = prefix === 0 ? 0 : (~0 << (32 - prefix)) >>> 0;
      const wildcardInt = (~maskInt) >>> 0;
      const netInt = (ipInt & maskInt) >>> 0;
      const bcastInt = (netInt | wildcardInt) >>> 0;

      let first = intToIp4(netInt);
      let last = intToIp4(bcastInt);
      let usable = BigInt(bcastInt - netInt + 1);

      if (prefix < 31) {
        first = intToIp4((netInt + 1) >>> 0);
        last = intToIp4((bcastInt - 1) >>> 0);
        usable -= 2n;
      }

      protoBadge.textContent = 'IPv4';
      cidrSlider.max = 32;
      cidrSlider.value = prefix;
      sliderLabel.textContent = `/${prefix}`;

      renderIPv4Visual(ipInt, netInt, bcastInt, prefix);

      return [
        ['Réseau / CIDR', `${intToIp4(netInt)}/${prefix}`],
        ['Adresse réseau', intToIp4(netInt)],
        ['Broadcast', intToIp4(bcastInt)],
        ['Plage d\'hôtes', `${first} – ${last}`],
        ['Masque direct', intToIp4(maskInt)],
        ['Wildcard (ACL)', intToIp4(wildcardInt)],
        ['Hôtes utilisables', usable.toLocaleString('fr-FR')]
      ];
    }

    // Calcul IPv6
    function parseIPv6(ipStr) {
      const halves = ipStr.trim().toLowerCase().split('::');
      if (halves.length > 2) throw new Error('Adresse IPv6 invalide');
      const left = halves[0] ? halves[0].split(':') : [];
      const right = halves.length === 2 && halves[1] ? halves[1].split(':') : [];
      const missing = 8 - (left.length + right.length);
      if ((halves.length === 1 && left.length !== 8) || (halves.length === 2 && missing < 1)) {
        throw new Error('Format IPv6 incomplet');
      }
      const groups = halves.length === 2 ? [...left, ...Array(missing).fill('0'), ...right] : left;
      let val = 0n;
      for (const g of groups) {
        if (!/^[0-9a-f]{1,4}$/.test(g)) throw new Error('Bloc hexadécimal IPv6 invalide');
        val = (val << 16n) | BigInt(parseInt(g, 16));
      }
      return val;
    }

    function formatIPv6(val) {
      const groups = [];
      for (let i = 7; i >= 0; i--) {
        groups.push(Number((val >> BigInt(i * 16)) & 0xffffn).toString(16));
      }
      let bestStart = -1, bestLen = 0, curStart = -1, curLen = 0;
      for (let i = 0; i < 8; i++) {
        if (groups[i] === '0') {
          if (curStart === -1) curStart = i;
          if (++curLen > bestLen) { bestStart = curStart; bestLen = curLen; }
        } else { curStart = -1; curLen = 0; }
      }
      if (bestLen > 1) {
        groups.splice(bestStart, bestLen, '');
        if (bestStart === 0) groups.unshift('');
        if (bestStart + bestLen === 8) groups.push('');
      }
      return groups.join(':');
    }

    function renderIPv6Visual(netVal, prefix) {
      const firstHextet = Number((netVal >> 112n) & 0xffffn);
      let scope = 'Global Unicast (2000::/3)';
      if ((firstHextet & 0xfe00) === 0xfc00) scope = 'Unique Local ULA (fc00::/7)';
      else if ((firstHextet & 0xffc0) === 0xfe80) scope = 'Link-Local (fe80::/10)';
      else if ((firstHextet & 0xff00) === 0xff00) scope = 'Multicast (ff00::/8)';
      else if (netVal === 1n) scope = 'Loopback (::1)';

      // Découpage visuel standard IPv6 : Global (<=48) | Subnet (48..64) | Interface (>64)
      const globalBits = Math.min(prefix, 48);
      const subBits = Math.max(0, Math.min(prefix - 48, 16));
      const hostBits = 128 - prefix;

      visualCard.innerHTML = `
        <div class="visual-title">
          <span>Architecture IPv6 (128 bits)</span>
          <span class="scope-pill">${scope}</span>
        </div>
        <div class="bit-bar">
          ${globalBits > 0 ? `<div class="bit-net" style="width:${(globalBits/128)*100}%">Préfixe (${globalBits}b)</div>` : ''}
          ${subBits > 0 ? `<div class="bit-sub" style="width:${(subBits/128)*100}%">Subnet (${subBits}b)</div>` : ''}
          ${hostBits > 0 ? `<div class="bit-host" style="width:${(hostBits/128)*100}%">Interface (${hostBits}b)</div>` : ''}
        </div>
        <div style="font-size:0.76rem; color:var(--text-muted); text-align:center;">
          ${prefix === 64 ? 'Standard LAN IPv6 (/64) : 16 bits dédiés au routage interne de sous-réseaux.' : `Préfixe /${prefix} (${hostBits} bits d'adressage machine).`}
        </div>
      `;
    }

    function computeIPv6(ipStr, prefix) {
      if (prefix < 0 || prefix > 128 || isNaN(prefix)) throw new Error('Préfixe IPv6 invalide (0-128)');
      const ipVal = parseIPv6(ipStr);
      const full = (1n << 128n) - 1n;
      const hostBits = BigInt(128 - prefix);
      const maskVal = prefix === 0 ? 0n : (full << hostBits) & full;
      const netVal = ipVal & maskVal;
      const lastVal = netVal | ((1n << hostBits) - 1n);

      protoBadge.textContent = 'IPv6';
      cidrSlider.max = 128;
      cidrSlider.value = prefix;
      sliderLabel.textContent = `/${prefix}`;

      renderIPv6Visual(netVal, prefix);

      return [
        ['Préfixe réseau', `${formatIPv6(netVal)}/${prefix}`],
        ['Première adresse', formatIPv6(netVal)],
        ['Dernière adresse', formatIPv6(lastVal)],
        ['Adresses totales', (1n << hostBits).toLocaleString('fr-FR')]
      ];
    }

    function update() {
      const raw = mainInput.value.trim();
      if (!raw) {
        visualCard.style.display = 'none';
        resultsCard.style.display = 'none';
        errorBox.style.display = 'none';
        return;
      }

      try {
        let rows;
        const parts = raw.includes('/') ? raw.split('/') : raw.split(/\s+/);

        if (parts.length === 2) {
          const [ip, maskOrPrefix] = parts;
          if (!maskOrPrefix) throw new Error('Entrez un préfixe CIDR ou un masque');

          if (ip.includes(':')) {
            if (!/^\d+$/.test(maskOrPrefix)) throw new Error('Préfixe IPv6 invalide');
            rows = computeIPv6(ip, Number(maskOrPrefix));
          } else if (maskOrPrefix.includes('.')) {
            rows = computeIPv4(ip, parseMaskToPrefix(maskOrPrefix));
          } else {
            if (!/^\d+$/.test(maskOrPrefix)) throw new Error('Préfixe CIDR invalide');
            rows = computeIPv4(ip, Number(maskOrPrefix));
          }
        } else if (parts.length === 1) {
          rows = raw.includes(':') ? computeIPv6(raw, 64) : computeIPv4(raw, 24);
        } else {
          throw new Error('Format non reconnu');
        }

        errorBox.style.display = 'none';
        visualCard.style.display = 'block';
        resultsCard.style.display = 'block';
        resultsCard.innerHTML = rows.map(([label, val]) => `
          <div class="row">
            <span class="row-label">${label}</span>
            <div class="row-value-wrap">
              <span class="row-value">${val}</span>
              <button class="copy-btn" data-copy="${val}">Copier</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        visualCard.style.display = 'none';
        resultsCard.style.display = 'none';
        errorBox.style.display = 'block';
        errorBox.textContent = err.message;
      }
    }

    mainInput.addEventListener('input', update);

    clearBtn.addEventListener('click', () => {
      mainInput.value = '';
      mainInput.focus();
      update();
    });

    cidrSlider.addEventListener('input', (e) => {
      const raw = mainInput.value.trim();
      const baseIp = raw.split('/')[0].split(/\s+/)[0] || '192.168.1.0';
      mainInput.value = `${baseIp}/${e.target.value}`;
      update();
    });

    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        mainInput.value = btn.dataset.val;
        update();
      });
    });

    // Navigation vers le sous-réseau précédent / suivant
    visualCard.addEventListener('click', (e) => {
      const btn = e.target.closest('.nav-sub');
      if (btn && btn.dataset.jump) {
        mainInput.value = btn.dataset.jump;
        update();
      }
    });

    resultsCard.addEventListener('click', (e) => {
      if (e.target.classList.contains('copy-btn')) {
        navigator.clipboard.writeText(e.target.dataset.copy);
        const orig = e.target.textContent;
        e.target.textContent = '✓';
        e.target.classList.add('copied');
        setTimeout(() => {
          e.target.textContent = orig;
          e.target.classList.remove('copied');
        }, 1200);
      }
    });

    update();
  </script>
</body>
</html>
